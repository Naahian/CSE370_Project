{%extends 'home.html'%}
{%block content%}
<main>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
            <ul class="nav flex-column">
                <li class="nav-item mb-2 text-center">
                    <a class="nav-link text-white" href="#dashboard" data-bs-toggle="tab">Dashboard</a>
                </li>
                <li class="nav-item mb-2 text-center">
                    <a class="nav-link text-white" href="#courses" data-bs-toggle="tab">Courses</a>
                </li>
                <li class="nav-item mb-2 btn btn-sm btn-outline-primary">
                    <a class="nav-link text-white" href="#create_course" data-bs-toggle="tab">Create
                        Course</a>
                </li>

            </ul>
        </nav>

        <!-- Main Content -->
        <div class="tab-content flex-grow-1 p-4">

            <!-- Courses Section -->
            <div class="tab-pane fade" id="courses">
                <h4>Courses</h4>
                <ul class="list-group" id="courses-list">
                    <!-- fetch from api -->
                </ul>
            </div>

            <!--Create Courses Section -->
            <div class="tab-pane fade w-50 m-auto" id="create_course">
                <h5 class="text-center">Create a New Course</h5>
                <form method="post" action="" enctype="multipart/form-data">
                    {% csrf_token %}

                    <!-- Created By (Hidden or Auto-Filled) -->
                    <input type="hidden" name="created_by" value="{{ user.id }}">

                    <!-- Title -->
                    <div class="mb-3">
                        <label for="title" class="form-label">Course Title</label>
                        <input type="text" class="form-control" id="title" name="title"
                            placeholder="Enter the course title" required>
                    </div>

                    <!-- Detail -->
                    <div class="mb-3">
                        <label for="detail" class="form-label">Course Detail</label>
                        <textarea class="form-control" id="detail" name="detail" rows="5"
                            placeholder="Enter detailed information about the course" required></textarea>
                    </div>

                    <!-- Video Link -->
                    <div class="mb-3">
                        <label for="video_link" class="form-label">Video Link</label>
                        <input type="url" class="form-control" id="video_link" name="video_link"
                            placeholder="Enter a valid video URL" required>
                    </div>

                    <!-- Thumbnail -->
                    <div class="mb-3">
                        <label for="thumbnail" class="form-label">Thumbnail</label>
                        <input type="file" class="form-control" id="thumbnail" name="thumbnail" accept="image/*">
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Create Course</button>
                    </div>
                </form>

            </div>

            <!-- Enrollment Section -->
            <div class="tab-pane fade" id="enrollment">
                <h4>Enrollment</h4>
                <ul class="list-group" id="enrollment-list">
                    <!-- fetch from api -->
                </ul>
            </div>

            <!-- Dashboard Section -->
            <div class="tab-pane fade active" id="dashboard">
                <h4 class="text-uppercase">{{user_type}} Dashboard</h4>
                <div class="row">

                    <div class="col-md-4">
                        <div class="card text-white bg-primary mb-3">
                            <div class="card-body">
                                <h5 class="card-text">Total Courses</h5>
                                <h3 class="card-title">{{courses}}</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-success mb-3">
                            <div class="card-body">
                                <h5 class="card-text">Total Enrollments</h5>
                                <h3 class="card-title">{{enrollments}}</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<script>

    document.addEventListener("DOMContentLoaded", function () {

        // Fetch Courses
        fetch('/courses/')
            .then(response => response.json())
            .then(data => {
                const coursesContainer = document.getElementById('courses-list');
                data.courses.forEach(course => {
                    const listItem = document.createElement('li');
                    listItem.className = "list-group-item"
                    listItem.innerHTML += `<strong>${course.title}</strong>`;
                    listItem.innerHTML += ` | by ${course.created_by}`;
                    coursesContainer.appendChild(listItem);
                });
            });

        // Fetch Enrollments
        fetch('/enrollment/')
            .then(response => response.json())
            .then(data => {
                const enrollmentsContainer = document.getElementById('enrollment-list');
                data.enrollment.forEach(enrollment => {
                    const listItem = document.createElement('li');
                    listItem.className = "list-group-item"
                    listItem.innerHTML += `User: <strong>${enrollment.username}</strong>`
                    listItem.innerHTML += ` Course: <strong>${enrollment.course}</strong>`;
                    enrollmentsContainer.appendChild(listItem);
                });
            });


    });

</script>

{%endblock%}
