{%extends 'home.html'%}
{%block content%}
<main>
    <div class="d-flex">
        <!-- Sidebar -->
        <nav class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
            <ul class="nav flex-column">
                <li class="nav-item mb-2">
                    <a class="nav-link text-white" href="#dashboard" data-bs-toggle="tab">Dashboard</a>
                </li>
                <li class="nav-item mb-2">
                    <a class="nav-link text-white" href="#enrollment" data-bs-toggle="tab">Enrollment</a>
                </li>

            </ul>
        </nav>

        <!-- Main Content -->
        <div class="tab-content flex-grow-1 p-4">

            <!-- Enrollment Section -->
            <div class="tab-pane fade" id="enrollment">
                <h4>Enrollment</h4>
                <ul class="list-group" id="enrollment-list">
                    <!-- fetch from api -->
                </ul>
            </div>

            <!-- Dashboard Section -->
            <div class="tab-pane fade active" id="dashboard">
                <h4 class="text-uppercase">{{user_type}} Dashboard</h4>
                <div class="row">

                    <div class="col-md-4">
                        <div class="card text-white bg-success mb-3">
                            <div class="card-body">
                                <h5 class="card-text">Total Completed</h5>
                                <h3 class="card-title">0</h3>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card text-white bg-primary mb-3">
                            <div class="card-body">
                                <h5 class="card-text">Total Enrollments</h5>
                                <h3 class="card-title">{{enrollments}}</h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<script>

    document.addEventListener("DOMContentLoaded", function () {
        // Fetch Users
        fetch('/user')
            .then(response => response.json())
            .then(data => {
                const usersContainer = document.getElementById('users-list');
                data.users.forEach(user => {
                    const listItem = document.createElement('li');
                    listItem.className = "list-group-item"
                    listItem.innerHTML = `
                    <strong>${user.username}</strong> | (${user.email})`;
                    usersContainer.appendChild(listItem);
                });
            });

        // Fetch Courses
        fetch('/courses/')
            .then(response => response.json())
            .then(data => {
                const coursesContainer = document.getElementById('courses-list');
                data.courses.forEach(course => {
                    const listItem = document.createElement('li');
                    listItem.className = "list-group-item"
                    listItem.innerHTML += `<strong>${course.title}</strong>`;
                    listItem.innerHTML += ` | by ${course.created_by}`;
                    coursesContainer.appendChild(listItem);
                });
            });

        // Fetch Enrollments
        fetch('/enrollment/')
            .then(response => response.json())
            .then(data => {
                const enrollmentsContainer = document.getElementById('enrollment-list');
                data.enrollment.forEach(enrollment => {
                    const listItem = document.createElement('li');
                    listItem.className = "list-group-item"
                    listItem.innerHTML += `User: <strong>${enrollment.username}</strong>`
                    listItem.innerHTML += ` Course: <strong>${enrollment.course}</strong>`;
                    enrollmentsContainer.appendChild(listItem);
                });
            });


    });

</script>

{%endblock%}
