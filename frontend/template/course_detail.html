{%extends 'home.html'%}
{%load static%}
{%block content%}
<!-- Main Course Detail Section -->
<div style="margin: 6rem">
    <div class="row">
        <!-- Course Thumbnail and Info -->
        <div class="col-md-4">
            <div class="card">
                <img src="{{thumbnail}}" alt="Course Thumbnail" class="course-thumbnail">
                <div class="card-body">
                    <p class="course-info">
                        <i class="fas fa-clock" style="color: orange;"></i>
                        Duration:
                        <span class="fw-semibold">{{duration}} hours</span>
                    </p>
                    <!-- Enroll Button -->
                    <a href="#" class="btn btn-success">Enroll Now</a>
                </div>

            </div>
        </div>

        <!-- Course Details -->
        <div class="col-md-8">
            <div class="card p-4">
                <h2 class="fw-bold">Course Title: {{title}}</h2>
                <p class="text-muted">By: <span class="fw-semibold">{{created_by.username}}</span></p>


                <!-- YouTube iframe -->
                <div class="my-3">
                    <iframe width="100%" height="400" src="{{video_url}}" frameborder="0" allowfullscreen></iframe>
                </div>

                <!-- Course Details Text -->
                <div class="course-details">
                    <h4>Course Detail</h4>
                    <p>{{detail}}</p>
                </div>

            </div>
        </div>
    </div>
</div>

{%endblock content%}
